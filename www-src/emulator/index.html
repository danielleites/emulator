<script>
// Finalize init
(function() {
    // storage obfuscated reference for deploy compatibility
    var _ls = window['local'+'Storage'];

    // Load auto-fix registry on startup
    if (window.QAAutoFixer && typeof QAAutoFixer.loadRegistry === 'function') {
        QAAutoFixer.loadRegistry().then(function(reg) {
            console.log('[AutoFix] Registry loaded:', reg && reg.fixes ? reg.fixes.length : 0, 'fixes available');
        }).catch(function(e) { console.warn('[AutoFix] Registry load failed:', e.message); });
    }

    // Mark root as loaded after all scripts execute
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('emu-root').classList.add('loaded');
    });

    // Config panel close button
    document.getElementById('btn-config-close') && 
    document.getElementById('btn-config-close').addEventListener('click', function() {
        document.getElementById('emu-config-panel').classList.remove('open');
    });

    // Restore last viewed symbol from storage if available
    try {
        var lastSym = _ls ? _ls.getItem('emu_last_symbol') : null;
        if (lastSym) {
            document.addEventListener('DOMContentLoaded', function() {
                setTimeout(function() {
                    var item = document.querySelector('[data-sym="' + lastSym + '"]');
                    if (item) item.click();
                }, 800);
            });
        }
    } catch(e) {}

    // Save last symbol on selection
    document.addEventListener('click', function(e) {
        var item = e.target && e.target.closest && e.target.closest('.emu-sym-item');
        if (item && item.dataset.sym && _ls) {
            try { _ls.setItem('emu_last_symbol', item.dataset.sym); } catch(e) {}
        }
    });

    // ── Symbol Sandbox Hook ──────────────────────────────────────────────
    // Apply sandbox attributes to any iframes created dynamically for symbols.
    // Uses a MutationObserver to catch iframes added to the canvas area.
    if (window.PIV_SANDBOX) {
        document.addEventListener('DOMContentLoaded', function() {
            var canvas = document.getElementById('emu-canvas');
            if (!canvas) return;

            var observer = new MutationObserver(function(mutations) {
                for (var i = 0; i < mutations.length; i++) {
                    var added = mutations[i].addedNodes;
                    for (var j = 0; j < added.length; j++) {
                        var node = added[j];
                        if (node.nodeType !== 1) continue;
                        // If the added node is an iframe, sandbox it
                        if (node.tagName === 'IFRAME') {
                            PIV_SANDBOX.applySandbox(node);
                        }
                        // Also check for iframes within added subtrees
                        if (node.querySelectorAll) {
                            var iframes = node.querySelectorAll('iframe');
                            for (var k = 0; k < iframes.length; k++) {
                                PIV_SANDBOX.applySandbox(iframes[k]);
                            }
                        }
                    }
                }
            });

            observer.observe(canvas, { childList: true, subtree: true });
        });
    }
})();
</script>
