<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect x="2" y="2" width="28" height="28" rx="4" fill="#1a1f2e"/>
  <!-- WOW lightning bolt / energy symbol -->
  <path d="M18,5 L11,17 H16 L14,27 L23,14 H17 Z"
        fill="#60a5fa" stroke="#93c5fd" stroke-width="0.5" stroke-linejoin="round"/>
  <!-- Subtle glow -->
  <path d="M18,5 L11,17 H16 L14,27 L23,14 H17 Z"
        fill="#60a5fa" opacity="0.3" filter="url(#glow)"/>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>
