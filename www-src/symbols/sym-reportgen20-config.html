<div class="c-config-content" dir="rtl" style="background:#0B1D33;color:#D0E4F5;font-family:'Segoe UI',sans-serif;padding:8px 12px;overflow-y:auto;max-height:100%;">
<style>/* PIV20 Config Premium */.cr20{margin-bottom:10px;transition:opacity 0.2s}.cr20 label{color:#64748B!important;text-transform:uppercase;letter-spacing:0.3px;font-weight:500;font-size:10px!important;margin-bottom:4px}.cr20 input[type=text],.cr20 input[type=number],.cr20 select{background:rgba(6,12,24,0.6)!important;border:1px solid rgba(91,192,235,0.08)!important;border-radius:6px!important;padding:6px 10px;transition:all 0.25s cubic-bezier(0.4,0,0.2,1)}.cr20 input[type=text]:focus,.cr20 input[type=number]:focus,.cr20 select:focus{border-color:#3B82F6!important;box-shadow:0 0 0 3px rgba(59,130,246,0.12),0 0 12px rgba(59,130,246,0.1)!important}.cr20 input[type=color]{border-radius:6px!important;transition:border-color 0.2s}.cr20 input[type=color]:hover{border-color:rgba(59,130,246,0.3)}.cr20 input[type=checkbox]{accent-color:#3B82F6}.ch20{background:linear-gradient(135deg,#3B82F6,#22D3EE)!important;-webkit-background-clip:text!important;-webkit-text-fill-color:transparent!important;background-clip:text;font-weight:600!important;margin:14px 0 8px!important;padding-bottom:5px!important;border-bottom:1px solid rgba(59,130,246,0.15)!important;letter-spacing:-0.01em}</style>

    <div class="ch20" style="color:#5BC0EB;font-size:13px;font-weight:600;border-bottom:1px solid rgba(91,192,235,.15);padding-bottom:4px;margin-bottom:6px;">
        מחולל דוחות v20
    </div>

    <!-- Title -->
    <div class="cr20" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
        <label style="color:#8BACC4;font-size:11px;">כותרת</label>
        <input ng-model="config.Title" style="width:180px;background:rgba(91,192,235,.08);border:1px solid rgba(91,192,235,.15);color:#D0E4F5;border-radius:3px;padding:3px 6px;font-size:11px;text-align:right;">
    </div>

    <!-- Baseline Integration -->
    <div class="ch20" style="color:#5BC0EB;font-size:11px;font-weight:600;margin-top:8px;margin-bottom:4px;">
        חיבור Baseline
    </div>

    <div class="cr20" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;">
        <label style="color:#8BACC4;font-size:11px;">נתיב Baseline JSON</label>
        <input ng-model="config.baselinePath" style="width:180px;background:rgba(91,192,235,.08);border:1px solid rgba(91,192,235,.15);color:#D0E4F5;border-radius:3px;padding:3px 6px;font-size:11px;text-align:left;direction:ltr;">
    </div>

    <div class="cr20" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;">
        <label style="color:#8BACC4;font-size:11px;">אתר ברירת מחדל</label>
        <input ng-model="config.defaultSite" style="width:150px;background:rgba(91,192,235,.08);border:1px solid rgba(91,192,235,.15);color:#D0E4F5;border-radius:3px;padding:3px 6px;font-size:11px;text-align:right;">
    </div>

    <div class="cr20" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;">
        <label style="color:#8BACC4;font-size:11px;">יחידה ברירת מחדל</label>
        <input ng-model="config.defaultUnit" style="width:150px;background:rgba(91,192,235,.08);border:1px solid rgba(91,192,235,.15);color:#D0E4F5;border-radius:3px;padding:3px 6px;font-size:11px;text-align:right;">
    </div>

    <!-- Report Options -->
    <div class="ch20" style="color:#5BC0EB;font-size:11px;font-weight:600;margin-top:8px;margin-bottom:4px;">
        אפשרויות דוח
    </div>

    <div class="cr20" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;">
        <label style="color:#8BACC4;font-size:11px;">תבנית ברירת מחדל</label>
        <select ng-model="config.defaultTemplate" style="width:140px;background:rgba(91,192,235,.08);border:1px solid rgba(91,192,235,.15);color:#D0E4F5;border-radius:3px;padding:3px 6px;font-size:11px;">
            <option value="status">סטטוס נוכחי</option>
            <option value="baseline">ניתוח Baseline</option>
            <option value="health">בריאות יחידה</option>
            <option value="anomaly">יומן חריגות</option>
            <option value="forecast">תחזית שעתית</option>
            <option value="full">דוח מלא</option>
        </select>
    </div>

    <div class="cr20" style="display:flex;align-items:center;gap:8px;margin-bottom:5px;">
        <input type="checkbox" ng-model="config.includeCharts" style="accent-color:#5BC0EB;">
        <label style="color:#8BACC4;font-size:11px;">כלול גרפים בדוח</label>
    </div>

    <div class="cr20" style="display:flex;align-items:center;gap:8px;margin-bottom:5px;">
        <input type="checkbox" ng-model="config.includeCorrelations" style="accent-color:#5BC0EB;">
        <label style="color:#8BACC4;font-size:11px;">כלול מתאמים</label>
    </div>

    <div class="cr20" style="display:flex;align-items:center;gap:8px;margin-bottom:5px;">
        <input type="checkbox" ng-model="config.includeAnomalyLog" style="accent-color:#5BC0EB;">
        <label style="color:#8BACC4;font-size:11px;">כלול יומן חריגות</label>
    </div>

    <div class="cr20" style="display:flex;align-items:center;gap:8px;margin-bottom:5px;">
        <input type="checkbox" ng-model="config.autoRefresh" style="accent-color:#5BC0EB;">
        <label style="color:#8BACC4;font-size:11px;">רענון אוטומטי</label>
    </div>

    <div class="cr20" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;" ng-show="config.autoRefresh">
        <label style="color:#8BACC4;font-size:11px;">מרווח רענון (שניות)</label>
        <input type="number" ng-model="config.refreshIntervalSec" min="10" max="3600" style="width:80px;background:rgba(91,192,235,.08);border:1px solid rgba(91,192,235,.15);color:#D0E4F5;border-radius:3px;padding:3px 6px;font-size:11px;text-align:center;">
    </div>

    <!-- History -->
    <div class="ch20" style="color:#5BC0EB;font-size:11px;font-weight:600;margin-top:8px;margin-bottom:4px;">
        היסטוריה
    </div>

    <div class="cr20" style="display:flex;align-items:center;gap:8px;margin-bottom:5px;">
        <input type="checkbox" ng-model="config.keepHistory" style="accent-color:#5BC0EB;">
        <label style="color:#8BACC4;font-size:11px;">שמור היסטוריית דוחות</label>
    </div>

    <div class="cr20" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;" ng-show="config.keepHistory">
        <label style="color:#8BACC4;font-size:11px;">מקסימום דוחות</label>
        <input type="number" ng-model="config.maxHistory" min="1" max="200" style="width:80px;background:rgba(91,192,235,.08);border:1px solid rgba(91,192,235,.15);color:#D0E4F5;border-radius:3px;padding:3px 6px;font-size:11px;text-align:center;">
    </div>

    <!-- Display -->
    <div class="ch20" style="color:#5BC0EB;font-size:11px;font-weight:600;margin-top:8px;margin-bottom:4px;">
        תצוגה
    </div>

    <div class="cr20" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;">
        <label style="color:#8BACC4;font-size:11px;">עשרוניות</label>
        <input type="number" ng-model="config.Decimals" min="0" max="6" style="width:60px;background:rgba(91,192,235,.08);border:1px solid rgba(91,192,235,.15);color:#D0E4F5;border-radius:3px;padding:3px 6px;font-size:11px;text-align:center;">
    </div>

    <div class="cr20" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;">
        <label style="color:#8BACC4;font-size:11px;">סף ישנות (שניות)</label>
        <input type="number" ng-model="config.StaleThreshold" min="0" style="width:80px;background:rgba(91,192,235,.08);border:1px solid rgba(91,192,235,.15);color:#D0E4F5;border-radius:3px;padding:3px 6px;font-size:11px;text-align:center;">
    </div>

    <div class="cr20" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;">
        <label style="color:#8BACC4;font-size:11px;">צבע דגש</label>
        <input type="color" ng-model="config.accentColor" style="width:40px;height:24px;border:none;background:transparent;cursor:pointer;">
    </div>

</div>
