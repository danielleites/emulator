<div dir="rtl" style="font-family:'Segoe UI',Arial,sans-serif;color:#c0d0e0;padding:12px;font-size:12px;">
<style>.cr20{margin-bottom:8px}.cr20 label{display:block;font-size:11px;color:#8BACC4;margin-bottom:3px}.cr20 input[type=text],.cr20 input[type=number],.cr20 select{width:100%;background:#0B1D33;border:1px solid rgba(46,139,192,.2);border-radius:4px;padding:5px 8px;color:#fff;font-size:12px}.cr20 input:focus,.cr20 select:focus{border-color:#5BC0EB;outline:none}.cr20 input[type=color]{width:40px;height:26px;border:1px solid rgba(46,139,192,.2);border-radius:4px;cursor:pointer}.cr20 input[type=checkbox]{margin-left:6px}.ch20{color:#5BC0EB;font-size:13px;margin:10px 0 6px;padding-bottom:4px;border-bottom:1px solid rgba(91,192,235,.2)}</style>
<style>/* PIV20 Config Premium */.cr20{margin-bottom:10px;transition:opacity 0.2s}.cr20 label{color:#64748B!important;text-transform:uppercase;letter-spacing:0.3px;font-weight:500;font-size:10px!important;margin-bottom:4px}.cr20 input[type=text],.cr20 input[type=number],.cr20 select{background:rgba(6,12,24,0.6)!important;border:1px solid rgba(91,192,235,0.08)!important;border-radius:6px!important;padding:6px 10px;transition:all 0.25s cubic-bezier(0.4,0,0.2,1)}.cr20 input[type=text]:focus,.cr20 input[type=number]:focus,.cr20 select:focus{border-color:#3B82F6!important;box-shadow:0 0 0 3px rgba(59,130,246,0.12),0 0 12px rgba(59,130,246,0.1)!important}.cr20 input[type=color]{border-radius:6px!important;transition:border-color 0.2s}.cr20 input[type=color]:hover{border-color:rgba(59,130,246,0.3)}.cr20 input[type=checkbox]{accent-color:#3B82F6}.ch20{background:linear-gradient(135deg,#3B82F6,#22D3EE)!important;-webkit-background-clip:text!important;-webkit-text-fill-color:transparent!important;background-clip:text;font-weight:600!important;margin:14px 0 8px!important;padding-bottom:5px!important;border-bottom:1px solid rgba(59,130,246,0.15)!important;letter-spacing:-0.01em}</style>

<div class="ch20">כללי</div>
<div class="cr20"><label>כותרת</label><input type="text" ng-model="config.Title"></div>
<div class="cr20"><label>ספרות עשרוניות</label><input type="number" ng-model="config.Decimals" min="0" max="4" step="1"></div>

<div class="ch20">נצילות</div>
<div class="cr20"><label><input type="checkbox" ng-model="config.ShowEfficiency"> הצג נצילות בין שלבים</label></div>
<div class="cr20"><label><input type="checkbox" ng-model="config.ShowLosses"> הצג הפסדים (MW + %)</label></div>
<div class="cr20"><label><input type="checkbox" ng-model="config.ShowPercentage"> הצג אחוזים על משפך</label></div>
<div class="cr20"><label><input type="checkbox" ng-model="config.AutoSort"> מיון אוטומטי (גדול לקטן)</label></div>
<div class="cr20"><label>סף נצילות תקין (%) (0 = מבוטל)</label><input type="number" ng-model="config.EfficiencyGoodPct" min="0" max="100" step="1"></div>
<div class="cr20"><label>סף נצילות אזהרה (%) (0 = מבוטל)</label><input type="number" ng-model="config.EfficiencyWarnPct" min="0" max="100" step="1"></div>
<div style="font-size:10px;color:#5A7A94;margin-bottom:8px">תקין: ≥{{config.EfficiencyGoodPct}}% | אזהרה: ≥{{config.EfficiencyWarnPct}}% | קריטי: &lt;{{config.EfficiencyWarnPct}}%</div>

<div class="ch20">תצוגה</div>
<div class="cr20">
    <label>תצוגת ברירת מחדל</label>
    <select ng-model="config.viewMode">
        <option value="funnel">משפך (SVG)</option>
        <option value="table">טבלה</option>
        <option value="efficiency">נצילות</option>
    </select>
</div>
<div class="cr20"><label>אנימציה</label>
    <select ng-model="config.animationType"><option value="fade">דעיכה</option><option value="none">ללא</option></select>
</div>
<div class="cr20"><label>מהירות אנימציה (ms)</label><input type="number" ng-model="config.animationSpeed" min="0" max="2000" step="50"></div>

<div class="ch20">גופנים</div>
<div class="cr20">
    <label>משפחת גופן</label>
    <select ng-model="config.fontFamily">
        <option value="Segoe UI">Segoe UI</option>
        <option value="Arial">Arial</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Courier New">Courier New</option>
        <option value="Tahoma">Tahoma</option>
        <option value="Verdana">Verdana</option>
        <option value="David">David</option>
        <option value="Miriam">Miriam</option>
        <option value="Narkisim">Narkisim</option>
        <option value="FrankRuehl">FrankRuehl</option>
        <option value="Calibri">Calibri</option>
        <option value="Consolas">Consolas</option>
    </select>
</div>
<div class="cr20"><label>גודל גופן (px)</label><input type="number" ng-model="config.fontSize" min="8" max="24" step="1"></div>
<div class="cr20"><label>גודל כותרת (px)</label><input type="number" ng-model="config.headerFontSize" min="10" max="28" step="1"></div>
<div class="cr20"><label><input type="checkbox" ng-model="config.fontBold"> מודגש</label></div>
<div class="cr20"><label><input type="checkbox" ng-model="config.fontItalic"> נטוי</label></div>

<div class="ch20">צבעים</div>
<div class="cr20" style="display:flex;gap:8px;align-items:center"><label style="margin:0;min-width:70px">כותרת</label><input type="color" ng-model="config.headerBg"></div>
<div class="cr20" style="display:flex;gap:8px;align-items:center"><label style="margin:0;min-width:70px">רקע</label><input type="color" ng-model="config.rowBg"></div>
<div class="cr20" style="display:flex;gap:8px;align-items:center"><label style="margin:0;min-width:70px">תקין</label><input type="color" ng-model="config.goodColor"></div>
<div class="cr20" style="display:flex;gap:8px;align-items:center"><label style="margin:0;min-width:70px">אזהרה</label><input type="color" ng-model="config.warningColor"></div>
<div class="cr20" style="display:flex;gap:8px;align-items:center"><label style="margin:0;min-width:70px">קריטי</label><input type="color" ng-model="config.criticalColor"></div>
<div class="cr20" style="display:flex;gap:8px;align-items:center"><label style="margin:0;min-width:70px">הדגשה</label><input type="color" ng-model="config.accentColor"></div>

<div class="ch20">AF / חיבור</div>
<div class="cr20"><label>סף נתון ישן (שניות)</label><input type="number" ng-model="config.StaleThreshold" min="30" max="3600" step="30"></div>
<div style="font-size:10px;color:#5A7A94;margin-bottom:8px">גרור תגים מ-AF Browser או PI Search. נתונים ישנים מסף זה יסומנו ⏱</div>
</div>
