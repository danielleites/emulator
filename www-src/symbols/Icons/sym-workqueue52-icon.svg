<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Queue list background -->
  <rect x="3" y="4" width="26" height="24" rx="2.5" fill="#0F1B2D" stroke="#2E8BC0" stroke-width="1.5"/>
  <rect x="3" y="4" width="26" height="7" rx="2.5" fill="#2E8BC0" opacity="0.2"/>
  <!-- Row 1 — issued (green indicator) -->
  <rect x="6"  y="13" width="3" height="3" rx="0.8" fill="#2ECC71"/>
  <line x1="11" y1="14.5" x2="24" y2="14.5" stroke="#5BC0EB" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Row 2 — suspended (amber) -->
  <rect x="6"  y="18" width="3" height="3" rx="0.8" fill="#F39C12"/>
  <line x1="11" y1="19.5" x2="21" y2="19.5" stroke="#8BACC4" stroke-width="1" stroke-linecap="round"/>
  <!-- Row 3 — draft (grey) -->
  <rect x="6"  y="23" width="3" height="3" rx="0.8" fill="#607D8B"/>
  <line x1="11" y1="24.5" x2="23" y2="24.5" stroke="#5A7A94" stroke-width="1" stroke-linecap="round"/>
  <!-- Priority flag top-right -->
  <path d="M25 5 L27 5 L27 9 L26 8 L25 9 Z" fill="#E74C3C" opacity="0.85"/>
</svg>
