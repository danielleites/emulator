<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Water Temperature Monitor icon -->
  <rect width="64" height="64" rx="10" fill="#140808"/>
  <!-- Thermometer body -->
  <rect x="28" y="8" width="8" height="32" rx="4" fill="none" stroke="#FF6B6B" stroke-width="1.5"/>
  <!-- Thermometer fill (hot) -->
  <rect x="30" y="26" width="4" height="14" rx="2" fill="#FF6B6B"/>
  <!-- Thermometer bulb -->
  <circle cx="32" cy="44" r="7" fill="#FF6B6B"/>
  <circle cx="32" cy="44" r="4" fill="#FF9999"/>
  <!-- Temperature scale ticks -->
  <line x1="36" y1="14" x2="40" y2="14" stroke="#905050" stroke-width="1"/>
  <line x1="36" y1="20" x2="40" y2="20" stroke="#905050" stroke-width="1"/>
  <line x1="36" y1="26" x2="42" y2="26" stroke="#f39c12" stroke-width="1.5"/>
  <line x1="36" y1="32" x2="40" y2="32" stroke="#905050" stroke-width="1"/>
  <!-- Water waves (background) -->
  <path d="M6 54 Q12 51 18 54 Q24 57 30 54 Q36 51 42 54 Q48 57 54 54 Q58 52 60 54" fill="none" stroke="#4ecdc4" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- ΔT indicator -->
  <text x="50" y="24" font-family="Segoe UI, sans-serif" font-size="8" font-weight="bold" fill="#F5D0D0">ΔT</text>
  <!-- Arrow up (temp rising) -->
  <polygon points="50,30 46,38 54,38" fill="#FF6B6B" opacity="0.8"/>
</svg>
