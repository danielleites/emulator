<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Battery body -->
  <rect x="3" y="10" width="22" height="13" rx="2" fill="#0C1C2E" stroke="#5BC8E8" stroke-width="1.4"/>
  <!-- Battery cap -->
  <rect x="25" y="13" width="3" height="7" rx="1" fill="#5BC8E8" opacity="0.6"/>
  <!-- Health fill (green) ~78% -->
  <rect x="5" y="12" width="16" height="9" rx="1.5" fill="#27AE60" opacity="0.25"/>
  <!-- Heart pulse line -->
  <polyline points="7,17 9,17 11,13 13,21 15,15 17,17 20,17" stroke="#5BC8E8" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
