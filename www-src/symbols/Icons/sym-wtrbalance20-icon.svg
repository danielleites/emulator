<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Water Balance Dashboard icon -->
  <rect width="64" height="64" rx="10" fill="#051510"/>
  <!-- Balance scale beam -->
  <line x1="10" y1="30" x2="54" y2="30" stroke="#1ABC9C" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="10" x2="32" y2="30" stroke="#1ABC9C" stroke-width="2" stroke-linecap="round"/>
  <!-- Pivot point -->
  <circle cx="32" cy="30" r="3" fill="#1ABC9C"/>
  <!-- Left pan (inflow, higher = more water) -->
  <path d="M10 30 Q10 42 22 42 Q34 42 34 30" fill="none" stroke="#3498DB" stroke-width="1.5"/>
  <!-- Water drop in left pan -->
  <path d="M22 34 Q20 38 22 40 Q24 42 26 40 Q28 38 26 34 Z" fill="#3498DB" opacity="0.8"/>
  <!-- Right pan (outflow) -->
  <path d="M30 30 Q30 38 42 38 Q54 38 54 30" fill="none" stroke="#e74c3c" stroke-width="1.5"/>
  <!-- Outflow arrows from right pan -->
  <line x1="42" y1="38" x2="42" y2="46" stroke="#e74c3c" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="42,52 38,44 46,44" fill="#e74c3c" opacity="0.8"/>
  <!-- Net balance bar at bottom -->
  <rect x="10" y="56" width="44" height="4" rx="2" fill="#1A3A30"/>
  <rect x="10" y="56" width="30" height="4" rx="2" fill="#1ABC9C"/>
  <!-- Label -->
  <text x="32" y="10" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="7" fill="#B8EEE3" font-weight="600">מאזן</text>
</svg>
