<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#08090B"/>
  <!-- Clipboard -->
  <rect x="7" y="8" width="18" height="20" rx="2" fill="none" stroke="#60A5FA" stroke-width="1.6"/>
  <!-- Clipboard top -->
  <rect x="12" y="6" width="8" height="5" rx="2" fill="none" stroke="#60A5FA" stroke-width="1.4"/>
  <!-- Check items -->
  <line x1="11" y1="15" x2="21" y2="15" stroke="#22C55E" stroke-width="1.2"/>
  <circle cx="11" cy="15" r="1.2" fill="#22C55E"/>
  <!-- Warning item -->
  <line x1="11" y1="19" x2="21" y2="19" stroke="#F59E0B" stroke-width="1.2"/>
  <circle cx="11" cy="19" r="1.2" fill="#F59E0B"/>
  <!-- Critical item -->
  <line x1="11" y1="23" x2="21" y2="23" stroke="#EF4444" stroke-width="1.2"/>
  <circle cx="11" cy="23" r="1.2" fill="#EF4444"/>
</svg>