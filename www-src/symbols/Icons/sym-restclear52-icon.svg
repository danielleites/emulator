<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Clipboard base -->
  <rect x="5" y="6" width="22" height="24" rx="2" fill="#0F1B2D" stroke="#2E8BC0" stroke-width="1.5"/>
  <!-- Clipboard top clip -->
  <rect x="10" y="3" width="12" height="6" rx="2" fill="#0A1628" stroke="#2E8BC0" stroke-width="1.2"/>
  <!-- Checked items (restoration steps) -->
  <path d="M9 13 l1.5 1.5 L13 11" stroke="#66BB6A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="15" y1="13" x2="24" y2="13" stroke="#66BB6A" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <path d="M9 18 l1.5 1.5 L13 16" stroke="#66BB6A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="15" y1="18" x2="22" y2="18" stroke="#66BB6A" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <!-- Open item (not yet cleared) -->
  <circle cx="10.5" cy="23" r="1.5" stroke="#EF5350" stroke-width="1.2" fill="none"/>
  <line x1="15" y1="23" x2="21" y2="23" stroke="#8BACC4" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <!-- Final clearance stamp -->
  <circle cx="24" cy="26" r="5" fill="#0A1628" stroke="#66BB6A" stroke-width="1.5"/>
  <path d="M22 26 l1.5 1.5 L26 24" stroke="#66BB6A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
