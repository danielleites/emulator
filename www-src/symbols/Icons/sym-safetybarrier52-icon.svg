<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Outer exclusion zone circle -->
  <circle cx="16" cy="16" r="12" stroke="#D32F2F" stroke-width="1.5" stroke-dasharray="4 2" fill="none"/>
  <!-- Inner control zone circle -->
  <circle cx="16" cy="16" r="7" stroke="#F57C00" stroke-width="1.2" stroke-dasharray="3 2" fill="none"/>
  <!-- Work site center -->
  <circle cx="16" cy="16" r="3" fill="#1976D2" opacity="0.7"/>
  <!-- No-entry symbol cross lines -->
  <line x1="5" y1="5" x2="27" y2="27" stroke="#D32F2F" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
  <line x1="27" y1="5" x2="5" y2="27" stroke="#D32F2F" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
  <!-- Barrier posts -->
  <line x1="16" y1="4"  x2="16" y2="1"  stroke="#D32F2F" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="16" x2="31" y2="16" stroke="#D32F2F" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="28" x2="16" y2="31" stroke="#D32F2F" stroke-width="2" stroke-linecap="round"/>
  <line x1="4"  y1="16" x2="1"  y2="16" stroke="#D32F2F" stroke-width="2" stroke-linecap="round"/>
</svg>
