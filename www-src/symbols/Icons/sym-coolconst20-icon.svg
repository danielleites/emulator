<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Cooling Constraint Monitor icon -->
  <rect width="64" height="64" rx="10" fill="#071020"/>
  <!-- Snowflake / cooling symbol -->
  <!-- Center cross -->
  <line x1="32" y1="10" x2="32" y2="54" stroke="#00CED1" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="#00CED1" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Diagonal arms -->
  <line x1="16" y1="16" x2="48" y2="48" stroke="#00CED1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="48" y1="16" x2="16" y2="48" stroke="#00CED1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Branch tips (snowflake detail) -->
  <line x1="32" y1="10" x2="27" y2="16" stroke="#00CED1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="10" x2="37" y2="16" stroke="#00CED1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="54" x2="27" y2="48" stroke="#00CED1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="54" x2="37" y2="48" stroke="#00CED1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="32" x2="16" y2="27" stroke="#00CED1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="32" x2="16" y2="37" stroke="#00CED1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="54" y1="32" x2="48" y2="27" stroke="#00CED1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="54" y1="32" x2="48" y2="37" stroke="#00CED1" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center circle -->
  <circle cx="32" cy="32" r="5" fill="#00CED1" opacity="0.8"/>
  <!-- Warning arc (constraint) -->
  <path d="M44 20 A17 17 0 0 1 52 38" fill="none" stroke="#e74c3c" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>
