<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Battery body -->
  <rect x="3" y="10" width="24" height="13" rx="2" fill="#041408" stroke="#1ABC9C" stroke-width="1.4"/>
  <!-- Battery cap -->
  <rect x="27" y="13" width="3" height="7" rx="1" fill="#1ABC9C" opacity="0.6"/>
  <!-- Charge fill -->
  <rect x="5" y="12" width="14" height="9" rx="1.5" fill="#1ABC9C" opacity="0.25"/>
  <rect x="5" y="12" width="14" height="9" rx="1.5" fill="none" stroke="#1ABC9C" stroke-width="0.8" stroke-dasharray="2 1.5"/>
  <!-- Clock overlay -->
  <circle cx="24" cy="8" r="5.5" fill="#041408" stroke="#1ABC9C" stroke-width="1.2"/>
  <line x1="24" y1="5.5" x2="24" y2="8" stroke="#1ABC9C" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="24" y1="8" x2="26" y2="9.5" stroke="#1ABC9C" stroke-width="1.2" stroke-linecap="round"/>
</svg>
