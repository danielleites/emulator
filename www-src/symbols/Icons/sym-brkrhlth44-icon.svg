<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#080B10"/>
  <!-- Breaker body -->
  <rect x="8" y="8" width="16" height="16" rx="3" fill="none" stroke="#F59E0B" stroke-width="1.6"/>
  <!-- Breaker switch lever (closed position) -->
  <line x1="16" y1="12" x2="16" y2="20" stroke="#2ECC71" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="16" cy="12" r="2" fill="#2ECC71"/>
  <circle cx="16" cy="20" r="2" fill="#F59E0B"/>
  <!-- Lightning bolt small -->
  <text x="24" y="10" text-anchor="middle" font-family="'Segoe UI',sans-serif"
        font-size="8" fill="#E74C3C">⚡</text>
</svg>