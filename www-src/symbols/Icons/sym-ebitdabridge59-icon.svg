<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <rect width="40" height="40" rx="8" fill="#0B1525"/>
  <!-- EBITDA bridge: stacked horizontal bar segments -->
  <rect x="4" y="8" width="10" height="6" rx="2" fill="#2A7FC1"/>
  <rect x="14" y="6" width="6" height="4" rx="1" fill="#27AE60"/>
  <rect x="20" y="9" width="5" height="5" rx="1" fill="#E74C3C"/>
  <rect x="25" y="6" width="7" height="4" rx="1" fill="#27AE60"/>
  <rect x="4" y="22" width="28" height="6" rx="2" fill="#1A5A8A"/>
  <!-- connector lines -->
  <line x1="14" y1="11" x2="14" y2="22" stroke="#2A7FC1" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="20" y1="11" x2="20" y2="22" stroke="#2A7FC1" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="25" y1="11" x2="25" y2="22" stroke="#2A7FC1" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="20" y="36" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="6" fill="#5BA8E0">EBITDA</text>
</svg>
