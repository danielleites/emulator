<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect x="2" y="2" width="28" height="28" rx="4" fill="#1a1f2e"/>
  <!-- Oscilloscope grid -->
  <line x1="6" y1="16" x2="26" y2="16" stroke="#334155" stroke-width="0.5"/>
  <line x1="16" y1="6" x2="16" y2="26" stroke="#334155" stroke-width="0.5"/>
  <!-- Frequency wave -->
  <polyline points="5,16 7,16 8,8 10,24 12,8 14,24 16,8 18,24 20,8 22,24 24,16 27,16"
            stroke="#60a5fa" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
  <!-- Glow effect -->
  <polyline points="5,16 7,16 8,8 10,24 12,8 14,24 16,8 18,24 20,8 22,24 24,16 27,16"
            stroke="#60a5fa" stroke-width="3" fill="none" opacity="0.3" stroke-linejoin="round"/>
  <!-- Hz label -->
  <rect x="20" y="22" width="7" height="3" rx="1" fill="#334155"/>
  <rect x="21" y="23" width="5" height="1" rx="0.5" fill="#34d399"/>
</svg>
