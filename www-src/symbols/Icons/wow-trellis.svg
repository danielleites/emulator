<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect x="2" y="2" width="28" height="28" rx="4" fill="#1a1f2e"/>
  <!-- Trellis grid (2x2 mini charts) -->
  <!-- Top-left -->
  <rect x="4" y="4" width="11" height="11" rx="1" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <polyline points="5,12 7,10 9,11 11,8 13,9" stroke="#60a5fa" stroke-width="1.2" fill="none"/>
  <!-- Top-right -->
  <rect x="17" y="4" width="11" height="11" rx="1" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <polyline points="18,12 20,9 22,10 24,7 26,8" stroke="#34d399" stroke-width="1.2" fill="none"/>
  <!-- Bottom-left -->
  <rect x="4" y="17" width="11" height="11" rx="1" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <polyline points="5,25 7,23 9,24 11,21 13,22" stroke="#fbbf24" stroke-width="1.2" fill="none"/>
  <!-- Bottom-right -->
  <rect x="17" y="17" width="11" height="11" rx="1" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <polyline points="18,25 20,22 22,23 24,20 26,21" stroke="#f87171" stroke-width="1.2" fill="none"/>
</svg>
