<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Inverter housing -->
  <rect x="2" y="6" width="12" height="20" rx="2" fill="#0A1322" stroke="#00C8E0" stroke-width="1.4"/>
  <rect x="16" y="6" width="12" height="20" rx="2" fill="#0A1322" stroke="#00C8E0" stroke-width="1.4"/>
  <!-- AC wave symbol -->
  <path d="M5 16 Q6.5 12 8 16 Q9.5 20 11 16" stroke="#00C8E0" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- DC bar symbol -->
  <line x1="19" y1="14" x2="25" y2="14" stroke="#1ABC9C" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="20" y1="17" x2="24" y2="17" stroke="#1ABC9C" stroke-width="1" stroke-linecap="round" stroke-dasharray="1.5 1"/>
  <!-- Status dot top right -->
  <circle cx="26" cy="8" r="3" fill="#2ECC71" opacity="0.9"/>
