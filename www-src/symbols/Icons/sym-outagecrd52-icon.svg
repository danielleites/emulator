<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background panel -->
  <rect x="2" y="4" width="28" height="24" rx="2.5" fill="#0F1B2D" stroke="#2E8BC0" stroke-width="1.5"/>
  <!-- Header -->
  <rect x="2" y="4" width="28" height="6" rx="2.5" fill="#2E8BC0" opacity="0.2"/>
  <line x1="5" y1="7" x2="27" y2="7" stroke="#5BC0EB" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Unit card 1 (active — amber left border) -->
  <rect x="5"  y="13" width="10" height="7" rx="1.5" fill="#1B2A3C" stroke="#8BACC4" stroke-width="0.7"/>
  <rect x="5"  y="13" width="2"  height="7" rx="1" fill="#EF9A9A" opacity="0.8"/>
  <!-- Unit card 2 (planned — teal left border) -->
  <rect x="18" y="13" width="10" height="7" rx="1.5" fill="#1B2A3C" stroke="#8BACC4" stroke-width="0.7"/>
  <rect x="18" y="13" width="2"  height="7" rx="1" fill="#26C6DA" opacity="0.8"/>
  <!-- Unit card 3 (complete — green) -->
  <rect x="5"  y="22" width="10" height="4" rx="1.5" fill="#1B2A3C" stroke="#8BACC4" stroke-width="0.7"/>
  <rect x="5"  y="22" width="2"  height="4" rx="1" fill="#66BB6A" opacity="0.8"/>
  <!-- Unit card 4 (overrun — red) -->
  <rect x="18" y="22" width="10" height="4" rx="1.5" fill="#1B2A3C" stroke="#8BACC4" stroke-width="0.7"/>
  <rect x="18" y="22" width="2"  height="4" rx="1" fill="#E74C3C" opacity="0.8"/>
</svg>
