name: Build Phone Control APK

# בונה את ה-APK של Phone Control בענן (GitHub Actions) ומעלה אותו כ-artifact להורדה.
# הפעלה ידנית מה-Actions tab (workflow_dispatch), או אוטומטית כשמשנים את ערכת הבנייה.

on:
  workflow_dispatch:
  push:
    paths:
      - 'phone-control-apk/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Build signed release APK
        working-directory: phone-control-apk/apk-build-kit
        run: |
          chmod +x scripts/build-apk.sh
          ./scripts/build-apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phonecontrol-apk
          path: phone-control-apk/apk-build-kit/output/*.apk
          if-no-files-found: error
          retention-days: 30
